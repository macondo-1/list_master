[project]
name = "list-master"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "attrs==25.3.0",
    "certifi==2026.10.18",
    "charset-normalizer==3.4.1",
    "et-xmlfile==2.0.0",
    "h11==0.16.0",
    "idna==3.15",
    "matplotlib==3.10.1",
    "numpy==2.2.6",
    "openpyxl==3.1.5",
    "outcome==1.3.0.post0",
    "packaging==24.2",
    "pandas==2.2.3",
    "pysocks==1.7.1",
    "pytest==9.1.1",
    "python-dateutil==2.9.0.post0",
    "python-dotenv==1.2.3",
    "pytz==2025.2",
    "requests==2.34.2",
    "selenium==4.31.0",
    "six==1.17.0",
    "sniffio==1.3.1",
    "sortedcontainers==2.4.0",
    "trio==0.29.0",
    "trio-websocket==0.12.2",
    "typing-extensions==4.13.1",
    "tzdata==2025.2",
    "urllib3==2.8.0",
    "webdriver-manager==4.0.2",
    "websocket-client==1.8.0",
    "wsproto==1.2.0",
]

[project.scripts]
list-master = "sis_services:main_concurrency"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["sis_services"]

[tool.setuptools.packages.find]
include = ["modules*"]
namespaces = true
